name: Cloud agent tests

on:
  push:
    branches: [main, feat/vercel-autonomous-agent]
  pull_request:

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run test:cloud
      - run: npm run build
