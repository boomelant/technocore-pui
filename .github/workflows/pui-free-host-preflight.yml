name: PUI free-host migration preflight (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-and-network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing DID and read Technocore without writes
        env:
          PUI_SEED: ${{ secrets.PUI_SEED }}
        run: node scripts/pui-host-preflight.mjs
